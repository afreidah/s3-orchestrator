# -------------------------------------------------------------------------------
# golangci-lint Configuration
#
# Author: Alex Freidah
#
# Linter settings for static analysis. Enables gocritic (diagnostic + performance
# tags) and misspell. Excludes generated sqlc code (postgres engine) from
# analysis.
# -------------------------------------------------------------------------------

version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gocritic
    - gosec
    - intrange
    - misspell
    - noctx
    - sloglint
    - staticcheck
  settings:
    gocritic:
      disabled-checks:
        - exitAfterDefer
      enabled-tags:
        - diagnostic
        - performance
    sloglint:
      context: "all"
      # `logfmt.Err` returns a slog.Attr that callers may mix with
      # key-value pairs; the handler-enforced contract documented in
      # docs/contributing/logging.md treats both forms as canonical, so
      # the lint allows mixed args by design.
      no-mixed-args: false
      # Snake-case keys match the project's attribute glossary in
      # docs/contributing/logging.md.
      key-naming-case: snake
      # Banned attribute keys: replace with the canonical names above.
      forbidden-keys:
        - err
        - e
        - source_backend
        - from_backend
        - to_backend
        - remote_addr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal/store/postgres/sqlc
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
