# -------------------------------------------------------------------------------
# golangci-lint Configuration
#
# Author: Alex Freidah
#
# Linter settings for static analysis. Enables gocritic (diagnostic + performance
# tags) and misspell. Excludes generated sqlc code (postgres engine) from
# analysis.
# -------------------------------------------------------------------------------

version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - gocognit
    - gocritic
    - gosec
    - intrange
    - misspell
    - noctx
    - revive
    - sloglint
    - staticcheck
  settings:
    gocognit:
      # Matches the SonarCloud cognitive-complexity gate. gocognit and Sonar
      # use different algorithms, so this catches most regressions locally but
      # is not a 1:1 replacement for the Sonar check.
      min-complexity: 15
    gocritic:
      disabled-checks:
        - exitAfterDefer
      enabled-tags:
        - diagnostic
        - performance
    revive:
      # Only the two rules that catch documentation drift. revive's default
      # set is much wider and overlaps what staticcheck and gocritic already
      # report, so enabling it whole would be noise for no new signal.
      rules:
        - name: package-comments
        - name: exported
    sloglint:
      context: "all"
      # `logfmt.Err` returns a slog.Attr that callers may mix with
      # key-value pairs; the handler-enforced contract documented in
      # docs/contributing/logging.md treats both forms as canonical, so
      # the lint allows mixed args by design.
      no-mixed-args: false
      # Snake-case keys match the project's attribute glossary in
      # docs/contributing/logging.md.
      key-naming-case: snake
      # Banned attribute keys: replace with the canonical names above.
      forbidden-keys:
        - err
        - e
        - source_backend
        - from_backend
        - to_backend
        - remote_addr
    depguard:
      rules:
        store-boundary:
          # Mechanically enforce the architectural rule that the
          # concrete metadata-store implementations are only imported by
          # the DI providers, the sync CLI, and the store package
          # itself. Worker / handler / proxy code must depend on the
          # narrow role interfaces in internal/store/core, resolved
          # through DI, so a refactor that swaps the implementation
          # does not cascade across the codebase.
          list-mode: lax
          files:
            - $all
            - "!**/internal/store/**"
            - "!**/internal/di/**"
            - "!**/internal/cli/**"
            - "!**/cmd/**"
            - "!**_test.go"
          deny:
            - pkg: github.com/afreidah/s3-orchestrator/internal/store/sqlite
              desc: depend on the narrow store roles in internal/store/core via DI; concrete stores are only constructed in internal/di and internal/cli
            - pkg: github.com/afreidah/s3-orchestrator/internal/store/postgres
              desc: depend on the narrow store roles in internal/store/core via DI; concrete stores are only constructed in internal/di and internal/cli
  exclusions:
    generated: lax
    presets:
      # Keeps revive to the two things it is here for: package docs that
      # describe the wrong package, and exported names that stutter. Dropping
      # this preset would instead demand a doc comment on every exported
      # symbol, which is fifty new comments and no new signal.
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal/store/postgres/sqlc
      - third_party$
      - builtin$
      - examples$

issues:
  # Report every finding. The defaults (50 per linter, 3 per message) still
  # fail the build, but they hide most of the work behind the few they print.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/afreidah/s3-orchestrator
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
