# -------------------------------------------------------------------------------
# golangci-lint Configuration
#
# Author: Alex Freidah
#
# Linter settings for static analysis. Enables gocritic (diagnostic + performance
# tags) and misspell. Excludes generated sqlc code (postgres engine) from
# analysis.
# -------------------------------------------------------------------------------

version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - gocognit
    - gocritic
    - gosec
    - intrange
    - misspell
    - noctx
    - sloglint
    - staticcheck
  settings:
    gocognit:
      # Matches the SonarCloud cognitive-complexity gate. gocognit and Sonar
      # use different algorithms, so this catches most regressions locally but
      # is not a 1:1 replacement for the Sonar check.
      min-complexity: 15
    gocritic:
      disabled-checks:
        - exitAfterDefer
      enabled-tags:
        - diagnostic
        - performance
    sloglint:
      context: "all"
      # `logfmt.Err` returns a slog.Attr that callers may mix with
      # key-value pairs; the handler-enforced contract documented in
      # docs/contributing/logging.md treats both forms as canonical, so
      # the lint allows mixed args by design.
      no-mixed-args: false
      # Snake-case keys match the project's attribute glossary in
      # docs/contributing/logging.md.
      key-naming-case: snake
      # Banned attribute keys: replace with the canonical names above.
      forbidden-keys:
        - err
        - e
        - source_backend
        - from_backend
        - to_backend
        - remote_addr
    depguard:
      rules:
        store-boundary:
          # Mechanically enforce the architectural rule that the
          # concrete metadata-store implementations are only imported by
          # the DI providers, the sync CLI, and the store package
          # itself. Worker / handler / proxy code must depend on
          # core.MetadataStore (or its narrow role interfaces) resolved
          # through DI, so a refactor that swaps the implementation
          # does not cascade across the codebase.
          list-mode: lax
          files:
            - $all
            - "!**/internal/store/**"
            - "!**/internal/di/**"
            - "!**/internal/cli/**"
            - "!**/cmd/**"
            - "!**_test.go"
          deny:
            - pkg: github.com/afreidah/s3-orchestrator/internal/store/sqlite
              desc: depend on core.MetadataStore via DI; concrete stores are only constructed in internal/di and internal/cli
            - pkg: github.com/afreidah/s3-orchestrator/internal/store/postgres
              desc: depend on core.MetadataStore via DI; concrete stores are only constructed in internal/di and internal/cli
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal/store/postgres/sqlc
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
