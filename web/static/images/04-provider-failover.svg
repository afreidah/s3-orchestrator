<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Provider failure and automatic recovery</title><desc id="desc">A client reaches s3-orchestrator. Backend A is unavailable, reads fail over to Backend B, and Backend C receives a rebuilt second copy.</desc>
  <defs><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#f8fafc}.s{font-size:15px;font-weight:600;fill:#e8dfd0}.k{font-size:13px;font-weight:800;fill:#e8c070;letter-spacing:.1em}.card{fill:#3a2e20;stroke:#c4a35a;stroke-width:2}.ok{fill:#3a2e20;stroke:#2a9d73;stroke-width:3}.down{fill:#3a2e20;stroke:#8b3a3a;stroke-width:3}.line{fill:none;stroke-width:3;stroke-linecap:round}</style><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#c4a35a"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2a9d73"/></marker></defs>
  <g class="t">
    <rect x="40" y="205" width="205" height="150" rx="26" class="card"/><g transform="translate(85 236)" fill="none" stroke="#e8c070" stroke-width="3"><rect width="50" height="38" rx="6"/><rect x="62" y="10" width="50" height="38" rx="6"/></g><text x="142" y="316" text-anchor="middle" class="h">S3 client</text>
    <path d="M245 280H380" class="line" stroke="#c4a35a" marker-end="url(#gold)"/>
    <rect x="380" y="145" width="330" height="270" rx="34" fill="#7a5a30" stroke="#e8c070" stroke-width="3"/><text x="545" y="208" text-anchor="middle" class="h" style="font-size:27px">s3-orchestrator</text><text x="545" y="239" text-anchor="middle" class="k" fill="#f8fafc">REPLICATION FACTOR · 2</text><g transform="translate(450 274)"><rect width="190" height="46" rx="23" fill="#6b4c2a"/><circle cx="28" cy="23" r="8" fill="#2a9d73"/><text x="49" y="29" class="s">circuit breaker</text></g><text x="545" y="363" text-anchor="middle" class="s">routes around failure</text>
    <path d="M710 220C770 220 770 105 835 105" class="line" stroke="#8b3a3a" stroke-dasharray="7 9"/>
    <path d="M710 280H835" class="line" stroke="#2a9d73" marker-end="url(#green)"/>
    <path d="M710 340C770 340 770 455 835 455" class="line" stroke="#2a9d73" stroke-dasharray="7 9" marker-end="url(#green)"/>
    <text x="758" y="178" class="k" fill="#d4a0a0">READ FAILS</text><text x="720" y="268" class="k" fill="#6ee7b7">FAILOVER</text><text x="720" y="408" class="k" fill="#6ee7b7">REBUILD</text>
    <g transform="translate(835 45)"><rect width="325" height="120" rx="24" class="down"/><g transform="translate(25 28)" fill="none" stroke="#d4a0a0" stroke-width="3"><ellipse cx="30" cy="10" rx="27" ry="9"/><path d="M3 10v39c0 5 12 9 27 9s27-4 27-9V10M8 4l44 54"/></g><text x="105" y="52" class="h" fill="#d4a0a0">Backend A</text><text x="105" y="80" class="s" fill="#d4a0a0">provider unavailable</text><rect x="236" y="27" width="64" height="27" rx="14" fill="#8b3a3a"/><text x="268" y="46" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#f8fafc">OPEN</text></g>
    <g transform="translate(835 220)"><rect width="325" height="120" rx="24" class="ok"/><g transform="translate(25 27)" fill="none" stroke="#6ee7b7" stroke-width="3"><ellipse cx="30" cy="10" rx="27" ry="9"/><path d="M3 10v39c0 5 12 9 27 9s27-4 27-9V10M3 30c0 5 12 9 27 9s27-4 27-9"/></g><text x="105" y="52" class="h">Backend B</text><text x="105" y="80" class="s">surviving replica</text><circle cx="268" cy="42" r="12" fill="#2a9d73"/></g>
    <g transform="translate(835 395)"><rect width="325" height="120" rx="24" class="ok"/><g transform="translate(25 27)" fill="none" stroke="#6ee7b7" stroke-width="3"><ellipse cx="30" cy="10" rx="27" ry="9"/><path d="M3 10v39c0 5 12 9 27 9s27-4 27-9V10M3 30c0 5 12 9 27 9s27-4 27-9"/></g><text x="105" y="52" class="h">Backend C</text><text x="105" y="80" class="s">replacement target</text><path d="M256 42h24M268 30v24" stroke="#2a9d73" stroke-width="4" stroke-linecap="round"/></g>
  </g>
</svg>
