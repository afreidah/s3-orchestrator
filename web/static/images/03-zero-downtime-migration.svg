<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Four-stage zero-downtime migration</title><desc id="desc">Import an existing bucket, replicate objects to a new provider, drain the old provider, and remove it from configuration while traffic continues.</desc>
  <defs><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.num{font-size:20px;font-weight:800;fill:#3a2e20}.h{font-size:22px;font-weight:750;fill:#f8fafc}.s{font-size:15px;font-weight:550;fill:#e8dfd0}.k{font-size:13px;font-weight:750;fill:#e8c070;letter-spacing:.1em}.card{fill:#3a2e20;stroke:#c4a35a;stroke-width:2}.rail{fill:none;stroke:#6b4c2a;stroke-width:6;stroke-linecap:round}</style></defs>
  <g class="t">
    <path class="rail" d="M150 118H1050"/><g fill="#e8c070"><circle cx="150" cy="118" r="24"/><circle cx="450" cy="118" r="24"/><circle cx="750" cy="118" r="24"/><circle cx="1050" cy="118" r="24"/></g>
    <text x="150" y="125" text-anchor="middle" class="num">1</text><text x="450" y="125" text-anchor="middle" class="num">2</text><text x="750" y="125" text-anchor="middle" class="num">3</text><text x="1050" y="125" text-anchor="middle" class="num">4</text>
    <g transform="translate(30 170)"><rect width="240" height="270" rx="26" class="card"/><text x="24" y="38" class="k">IMPORT</text><g transform="translate(78 58)" fill="none" stroke="#e8c070" stroke-width="3"><ellipse cx="42" cy="12" rx="38" ry="12"/><path d="M4 12v52c0 7 17 12 38 12s38-5 38-12V12M4 38c0 7 17 12 38 12s38-5 38-12"/><path d="M42 98V70M30 86l12 12 12-12"/></g><text x="120" y="190" text-anchor="middle" class="h">Connect the old</text><text x="120" y="218" text-anchor="middle" class="h">bucket</text><text x="120" y="249" text-anchor="middle" class="s">Sync objects into metadata</text></g>
    <g transform="translate(330 170)"><rect width="240" height="270" rx="26" class="card"/><text x="24" y="38" class="k">REPLICATE</text><g transform="translate(65 61)" fill="none" stroke="#e8c070" stroke-width="3"><ellipse cx="25" cy="12" rx="23" ry="8"/><path d="M2 12v40c0 5 10 8 23 8s23-3 23-8V12"/><ellipse cx="85" cy="12" rx="23" ry="8"/><path d="M62 12v40c0 5 10 8 23 8s23-3 23-8V12M51 31h8M54 25l8 6-8 6"/></g><text x="120" y="190" text-anchor="middle" class="h">Add the new</text><text x="120" y="218" text-anchor="middle" class="h">provider</text><text x="120" y="249" text-anchor="middle" class="s">Workers copy in background</text></g>
    <g transform="translate(630 170)"><rect width="240" height="270" rx="26" class="card"/><text x="24" y="38" class="k">DRAIN</text><g transform="translate(78 58)" fill="none" stroke="#e8c070" stroke-width="3"><ellipse cx="42" cy="12" rx="38" ry="12"/><path d="M4 12v52c0 7 17 12 38 12s38-5 38-12V12M20 84h44M28 76l-8 8 8 8M56 76l8 8-8 8"/></g><text x="120" y="190" text-anchor="middle" class="h">Empty the old</text><text x="120" y="218" text-anchor="middle" class="h">backend</text><text x="120" y="249" text-anchor="middle" class="s">Traffic keeps flowing</text></g>
    <g transform="translate(930 170)"><rect width="240" height="270" rx="26" fill="#7a5a30" stroke="#e8c070" stroke-width="3"/><text x="24" y="38" class="k" fill="#f8fafc">COMPLETE</text><g transform="translate(81 62)" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="39" cy="39" r="36"/><path d="M20 39l13 13 26-29"/></g><text x="120" y="190" text-anchor="middle" class="h">Remove old</text><text x="120" y="218" text-anchor="middle" class="h">configuration</text><text x="120" y="249" text-anchor="middle" class="s">No cutover · no downtime</text></g>
    <rect x="390" y="472" width="420" height="30" rx="15" fill="#6b4c2a"/><text x="600" y="493" text-anchor="middle" class="k" fill="#f8fafc">CLIENT TRAFFIC CONTINUES THROUGH EVERY STAGE</text>
  </g>
</svg>
