<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Three deployment tiers</title><desc id="desc">Deployment can evolve from standalone SQLite, to a single node with PostgreSQL, to horizontal instances with PostgreSQL and Redis.</desc>
  <defs><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h{font-size:25px;font-weight:750;fill:#f8fafc}.s{font-size:16px;font-weight:550;fill:#e8dfd0}.k{font-size:13px;font-weight:750;fill:#e8c070;letter-spacing:.12em}.card{fill:#3a2e20;stroke:#c4a35a;stroke-width:2}.line{stroke:#c4a35a;stroke-width:3;fill:none;stroke-linecap:round}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#c4a35a"/></marker></defs>
  <g class="t">
    <path class="line" marker-end="url(#a)" d="M380 250h50"/><path class="line" marker-end="url(#a)" d="M770 250h50"/>
    <g transform="translate(40 90)"><rect width="340" height="320" rx="30" class="card"/><text x="34" y="48" class="k">01 · START SIMPLE</text><g transform="translate(125 78)" fill="none" stroke="#e8c070" stroke-width="4"><rect width="90" height="70" rx="12"/><path d="M18 22h54M18 38h54M18 54h32"/></g><text x="170" y="205" text-anchor="middle" class="h">Standalone</text><text x="170" y="241" text-anchor="middle" class="s">SQLite + memory cache</text><path d="M34 268h272" stroke="#6b4c2a"/><text x="170" y="298" text-anchor="middle" class="s">Zero external dependencies</text></g>
    <g transform="translate(430 60)"><rect width="340" height="380" rx="30" class="card"/><text x="34" y="48" class="k">02 · ADD DURABILITY</text><g transform="translate(103 80)" fill="none" stroke="#e8c070" stroke-width="4"><rect x="0" y="15" width="62" height="52" rx="10"/><path d="M14 32h34M14 48h24"/><ellipse cx="130" cy="25" rx="34" ry="12"/><path d="M96 25v48c0 7 15 12 34 12s34-5 34-12V25M96 49c0 7 15 12 34 12s34-5 34-12"/><path d="M65 41h28"/></g><text x="170" y="225" text-anchor="middle" class="h">Single node</text><text x="170" y="261" text-anchor="middle" class="s">PostgreSQL metadata</text><path d="M34 293h272" stroke="#6b4c2a"/><text x="170" y="323" text-anchor="middle" class="s">Relational · backed up</text><text x="170" y="348" text-anchor="middle" class="s">queryable</text></g>
    <g transform="translate(820 30)"><rect width="340" height="440" rx="30" fill="#7a5a30" stroke="#e8c070" stroke-width="3"/><text x="34" y="48" class="k" fill="#f8fafc">03 · SCALE OUT</text><g transform="translate(57 79)" fill="none" stroke="#f8fafc" stroke-width="4"><rect x="0" y="0" width="54" height="48" rx="9"/><rect x="0" y="68" width="54" height="48" rx="9"/><rect x="76" y="34" width="54" height="48" rx="9"/><ellipse cx="194" cy="31" rx="30" ry="11"/><path d="M164 31v40c0 6 13 11 30 11s30-5 30-11V31M164 51c0 6 13 11 30 11s30-5 30-11"/><path d="M56 24h24M56 92h24M132 58h29"/></g><text x="170" y="242" text-anchor="middle" class="h">Horizontal</text><text x="170" y="278" text-anchor="middle" class="s">PostgreSQL + Redis counters</text><path d="M34 310h272" stroke="#a77d42"/><text x="170" y="340" text-anchor="middle" class="s">N independent instances</text><text x="170" y="366" text-anchor="middle" class="s">globally enforced quotas</text><rect x="89" y="390" width="162" height="28" rx="14" fill="#e8c070"/><text x="170" y="410" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#3a2e20">HIGH AVAILABILITY</text></g>
  </g>
</svg>
