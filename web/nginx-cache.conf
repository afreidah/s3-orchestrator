# -------------------------------------------------------------------------------
# Static asset caching, compression and origin isolation for the Hugo docs site.
#
# conf.d/*.conf is included from the http context by the stock nginx.conf, so
# these directives apply to the default server without replacing default.conf.
#
# Hugo fingerprints CSS and JS in their file names, so those are safe to cache
# for a year. Images are not fingerprinted, so they get a shorter window. HTML
# always revalidates, otherwise a redeploy would not be visible until the cache
# expired.
# -------------------------------------------------------------------------------

map $sent_http_content_type $asset_expires {
    default                   off;
    text/html                 epoch;
    text/css                  1y;
    text/javascript           1y;
    application/javascript    1y;
    application/json          1h;
    ~image/                   30d;
    ~font/                    1y;
}

expires $asset_expires;

# Missing pages get the site's 404 page with a real 404 status, so crawlers
# drop them instead of indexing a soft 404.
error_page 404 /404.html;

# nginx sits behind a TLS-terminating proxy and sees plain HTTP, so an absolute
# trailing-slash redirect would point at http://. A relative one keeps the
# scheme the client used and avoids a redirect chain for crawlers.
absolute_redirect off;

charset utf-8;
charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

# The site opens no windows it talks to, so severing the opener relationship
# costs nothing and puts the document in its own browsing context group.
add_header Cross-Origin-Opener-Policy same-origin always;

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;
