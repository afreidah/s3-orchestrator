# -------------------------------------------------------------------------------
# Static asset caching + compression for the Hugo docs site.
#
# conf.d/*.conf is included from the http context by the stock nginx.conf, so
# these directives apply to the default server without replacing default.conf.
#
# Hugo fingerprints theme assets with a ?<timestamp> query string, so css/js/
# fonts are safe to cache for a year. Images are referenced without a query
# string, so they get a shorter window. HTML always revalidates, otherwise a
# redeploy would not be visible until the cache expired.
# -------------------------------------------------------------------------------

map $sent_http_content_type $asset_expires {
    default                   off;
    text/html                 epoch;
    text/css                  1y;
    text/javascript           1y;
    application/javascript    1y;
    application/json          1h;
    ~image/                   30d;
    ~font/                    1y;
}

expires $asset_expires;

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;
