# -------------------------------------------------------------------------------
# Helm Template - Secret (chart-managed credentials)
#
# Author: Alex Freidah
#
# Renders the orchestrator's S3 credential bundle into a Secret that the
# Deployment mounts as env vars. Operators preferring an externally-managed
# Secret (sealed-secrets, ESO, vault-csi) can set .Values.existingSecret and
# this template renders nothing.
# -------------------------------------------------------------------------------

{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3-orchestrator.fullname" . }}
  labels:
    {{- include "s3-orchestrator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
