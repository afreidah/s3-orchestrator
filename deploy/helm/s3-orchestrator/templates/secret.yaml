# -------------------------------------------------------------------------------
# Helm Template - Secret (chart-managed credentials)
#
# Author: Alex Freidah
#
# Renders .Values.secrets into the Secret the Deployment loads as environment
# variables, which the config references as ${NAME}. Operators preferring an
# externally-managed Secret (sealed-secrets, External Secrets, vault-csi) set
# .Values.existingSecret and this template renders nothing.
# -------------------------------------------------------------------------------

{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3-orchestrator.fullname" . }}
  labels:
    {{- include "s3-orchestrator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
