# -------------------------------------------------------------------------------
# Helm Template - Ingress (optional)
#
# Author: Alex Freidah
#
# Ingress in front of the Service for clusters that route with an Ingress
# controller. An empty className uses the cluster's default IngressClass, and
# an empty host matches every host. Clusters on Gateway API use httproute.yaml.
# -------------------------------------------------------------------------------

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "s3-orchestrator.fullname" . }}
  labels:
    {{- include "s3-orchestrator.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      {{- with .Values.ingress.host }}
      hosts:
        - {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "s3-orchestrator.fullname" . }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
{{- end }}
