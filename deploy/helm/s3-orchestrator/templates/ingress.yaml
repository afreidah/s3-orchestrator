# -------------------------------------------------------------------------------
# Helm Template - Ingress (optional)
#
# Author: Alex Freidah
#
# Optional Ingress fronting the Service. Gated by .Values.ingress.enabled so
# operators using a different LB (cloud LB, ServiceMesh gateway) can leave
# this off. Annotations and TLS hosts come from .Values; the rules are
# generated from .Values.ingress.hosts.
# -------------------------------------------------------------------------------

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "s3-orchestrator.fullname" . }}
  labels:
    {{- include "s3-orchestrator.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "s3-orchestrator.fullname" . }}
                port:
                  name: http
{{- end }}
