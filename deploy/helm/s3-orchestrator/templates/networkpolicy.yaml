# -------------------------------------------------------------------------------
# Helm Template - NetworkPolicy (optional)
#
# Author: Alex Freidah
#
# Admits traffic to the S3 port from any source, and to the dedicated metrics
# port only from the pods scraperSelector matches. Egress stays open: the
# backends, database and Redis are addresses the chart cannot know. Gated so a
# cluster without a CNI that enforces NetworkPolicies can leave it off.
# -------------------------------------------------------------------------------

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "s3-orchestrator.fullname" . }}
  labels:
    {{- include "s3-orchestrator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "s3-orchestrator.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- if .Values.metrics.dedicatedListener.enabled }}
    - from:
        {{- if .Values.metrics.dedicatedListener.scraperSelector }}
        - podSelector:
            {{- toYaml .Values.metrics.dedicatedListener.scraperSelector | nindent 12 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: {{ .Values.metrics.dedicatedListener.port }}
          protocol: TCP
    {{- end }}
  egress:
    - {}
{{- end }}
