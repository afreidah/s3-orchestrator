# -------------------------------------------------------------------------------
# Helm Template - ServiceAccount
#
# Author: Alex Freidah
#
# Optional dedicated ServiceAccount for the orchestrator pod. Gated by
# .Values.serviceAccount.create so operators using a cluster-default SA or
# IRSA-style workload identity (where the SA is created out-of-band) can
# disable this without losing the rest of the chart.
# -------------------------------------------------------------------------------

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "s3-orchestrator.fullname" . }}
  labels:
    {{- include "s3-orchestrator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
