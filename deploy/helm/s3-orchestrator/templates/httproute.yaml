# -------------------------------------------------------------------------------
# Helm Template - HTTPRoute (optional)
#
# Author: Alex Freidah
#
# Gateway API route from an existing Gateway to the Service, the successor to
# Ingress. Needs the Gateway API CRDs and a Gateway named in parentRefs. Large
# uploads need a request timeout longer than the slowest one, or 0s for none.
# -------------------------------------------------------------------------------

{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "s3-orchestrator.fullname" . }}
  labels:
    {{- include "s3-orchestrator.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "s3-orchestrator.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
