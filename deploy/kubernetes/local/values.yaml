# -------------------------------------------------------------------------------
# S3 Orchestrator - Local Dev Helm Values (k3d)
#
# Author: Alex Freidah
#
# Only what the Kubernetes demo needs of the chart. The orchestrator config is
# the shared deploy/local/config.yaml, which demo.sh renders and passes with
# --set-file configFile, and the replica count comes from INSTANCES. The
# production chart defaults live in deploy/helm/s3-orchestrator/values.yaml.
# Not for production use.
# -------------------------------------------------------------------------------

# --- The image demo.sh builds and imports into k3d ---
image:
  repository: s3-orchestrator
  tag: "local"
  pullPolicy: Never

# --- The same limits as the Nomad demo; Go sets its limits from these ---
resources:
  requests:
    cpu: "2"
    memory: 1024Mi
  limits:
    cpu: "2"
    memory: 1024Mi

networkPolicy:
  enabled: false

# --- Matches telemetry.metrics.listen and pprof in the shared config; Alloy scrapes it ---
metrics:
  enabled: true
  path: /metrics
  dedicatedListener:
    enabled: true
    port: 9001
  pprof: true

# --- The demo's Traefik, on a catch-all host so localhost:9000 reaches it ---
ingress:
  enabled: true
  className: traefik
  host: ""

# --- The shared config carries its dev credentials inline ---
secrets: {}
