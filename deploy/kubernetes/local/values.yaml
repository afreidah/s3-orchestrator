# -------------------------------------------------------------------------------
# S3 Orchestrator - Local Dev Helm Values (k3d + docker-compose)
#
# Author: Alex Freidah
#
# Only what the Kubernetes demo needs of the chart. The orchestrator config is
# the shared deploy/local/config.yaml, which demo.sh renders and passes with
# --set-file configFile, and the replica count comes from INSTANCES. The
# production chart defaults live in deploy/helm/s3-orchestrator/values.yaml.
# Not for production use.
# -------------------------------------------------------------------------------

image:
  repository: s3-orchestrator
  tag: "local"
  pullPolicy: Never

# The same limits as the Nomad demo's tasks, with the Go memory limit at 90%
# of the pod's memory.
env:
  GOMEMLIMIT: "920MiB"
  GOMAXPROCS: "2"

resources:
  requests:
    cpu: "2"
    memory: 1024Mi
  limits:
    cpu: "2"
    memory: 1024Mi

networkPolicy:
  enabled: false

# Matches telemetry.metrics.listen and pprof in the shared config. Alloy scrapes
# each pod's metrics port and remote-writes to the host Prometheus.
metrics:
  enabled: true
  path: /metrics
  dedicatedListener:
    enabled: true
    port: 9001
  pprof: true

# Routed by the demo's own Traefik, the same version and settings the Nomad
# demo runs, on a catch-all host so localhost:9000 reaches it. The chart's
# nginx annotations are removed rather than merged in.
ingress:
  enabled: true
  className: traefik
  annotations: null
  host: ""

# The shared config carries its dev credentials inline, so the chart's Secret
# only has to exist for the pod's envFrom.
secrets: {}
