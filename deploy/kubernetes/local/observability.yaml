# -------------------------------------------------------------------------------
# Demo Observability Stack - Local Dev Kubernetes Manifests
#
# Author: Alex Freidah
#
# Prometheus, Grafana, Tempo and Loki for the local Kubernetes demo, in the
# "demo" namespace beside the backing services. Alloy runs as the DaemonSet in
# alloy-daemonset.yaml. Tempo, Loki and Grafana run the same deploy/monitoring
# configs as docker-compose.test.yml: demo.sh loads them into the ConfigMaps
# mounted here, and the environment below supplies the in-cluster addresses
# the configs leave open. Prometheus has its own config, below.
#
# Grafana, Prometheus and Tempo are LoadBalancer Services on the ports
# docker-compose.test.yml publishes, which k3d's load balancer forwards from
# the host, so the demo's URLs are the same on either scheduler.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------
# PROMETHEUS
# -------------------------------------------------------------------------

# deploy/monitoring/prometheus.yml discovers instances through the Nomad API,
# which does not exist here. Alloy scrapes the orchestrator pods instead and
# remote-writes, as does Tempo's metrics generator, so this Prometheus scrapes
# nothing itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: demo
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: demo
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 19090
      targetPort: http
---
# -------------------------------------------------------------------------
# TEMPO
# -------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: demo
  labels:
    app.kubernetes.io/name: tempo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.9.1
          args: ["-config.file=/etc/tempo/tempo.yml", "-config.expand-env=true"]
          env:
            - name: PROMETHEUS_REMOTE_WRITE_URL
              value: http://prometheus:19090/api/v1/write
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          # Trace volume under a perf run is what sizes this, not the idle
          # case.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
# The orchestrator pods send traces to otlp-grpc; only the HTTP API is
# published on the host.
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: demo
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
# -------------------------------------------------------------------------
# LOKI
# -------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: demo
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          args: ["-config.file=/etc/loki/config.yml"]
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /var/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
# -------------------------------------------------------------------------
# GRAFANA
# -------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: demo
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          # An anonymous admin session, so the demo opens straight onto the
          # dashboard. The datasource URLs feed the provisioning file.
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: PROMETHEUS_URL
              value: http://prometheus:19090
            - name: LOKI_URL
              value: http://loki:3100
            - name: TEMPO_URL
              value: http://tempo:3200
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          # Grafana idles near 600 MB, and with the dashboard open during a
          # perf run its query load pushes it past 1 GB.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: demo
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 13000
      targetPort: http
