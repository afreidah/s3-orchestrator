# -------------------------------------------------------------------------------
# Grafana Datasource Provisioning - Prometheus / Loki / Tempo
#
# Author: Alex Freidah
#
# Read at Grafana startup to declare the datasources backing the demo
# dashboards. Each URL comes from the environment Grafana runs in, because
# docker-compose, the Nomad demo and the Kubernetes demo each reach
# Prometheus, Loki and Tempo at a different address: PROMETHEUS_URL,
# LOKI_URL and TEMPO_URL are set wherever Grafana is deployed. Grafana
# expands environment variables throughout provisioning files, which is why
# the literal dollar sign in the TraceID link below is doubled.
# -------------------------------------------------------------------------------

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: ${LOKI_URL}
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: View Trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: ${TEMPO_URL}
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
