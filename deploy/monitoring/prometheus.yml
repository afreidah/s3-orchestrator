# -------------------------------------------------------------------------------
# Prometheus - Local Demo Configuration
#
# Author: Alex Freidah
#
# Scrape config for the local demos. The Nomad demo's instances are scraped
# directly, found through Nomad's service registry. The Kubernetes demo's pods
# are not reachable from the host, so Alloy scrapes them in the cluster and
# remote-writes here. Either way every series carries job="s3-orchestrator".
# -------------------------------------------------------------------------------

global:
  scrape_interval: 10s

scrape_configs:
  # Every instance's dedicated metrics listener, from the Nomad registry. The
  # job label is rewritten so dashboard queries on job="s3-orchestrator" see
  # the whole fleet, one series per instance.
  - job_name: s3-orchestrator-nomad
    metrics_path: /metrics
    nomad_sd_configs:
      - server: "http://127.0.0.1:4646"
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_nomad_service]
        regex: s3-orchestrator-metrics
        action: keep
      - target_label: job
        replacement: s3-orchestrator
