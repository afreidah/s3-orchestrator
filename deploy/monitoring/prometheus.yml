# -------------------------------------------------------------------------------
# Prometheus - Local Demo Configuration
#
# Author: Alex Freidah
#
# Scrape config for the docker-compose / kubernetes local demo. Points at the
# orchestrator's /metrics endpoint and at the container exporters surfaced by
# the demo stack. Production deployments wire scrape via service discovery
# instead of the static targets used here.
# -------------------------------------------------------------------------------

global:
  scrape_interval: 10s

scrape_configs:
  - job_name: s3-orchestrator
    metrics_path: /metrics
    # Orchestrator exposes /metrics and /debug/pprof/* on a dedicated
    # listener (telemetry.metrics.listen = "0.0.0.0:9001" in the demo
    # job spec) so that pprof endpoints never share a port with the
    # public S3 API. Production deployments should bind this listener
    # to an internal-only interface.
    static_configs:
      - targets: ["localhost:9001"]
