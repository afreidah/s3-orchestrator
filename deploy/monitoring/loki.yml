# -------------------------------------------------------------------------------
# Loki - Local Demo Configuration
#
# Author: Alex Freidah
#
# Single-binary Loki setup for the docker-compose / kubernetes local demo.
# Auth is disabled and storage uses the local filesystem so the demo runs
# without an object store. Production deployments use the upstream
# distributed reference architecture instead.
# -------------------------------------------------------------------------------

auth_enabled: false

server:
  http_listen_address: "0.0.0.0"
  http_listen_port: 3100
  grpc_listen_address: "0.0.0.0"
  grpc_listen_port: 9096

common:
  ring:
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /var/loki

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /var/loki/chunks

limits_config:
  allow_structured_metadata: true
