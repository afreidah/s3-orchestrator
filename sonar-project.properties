# -------------------------------------------------------------------------------
# SonarCloud Project Configuration
#
# Author: Alex Freidah
#
# Pointed at by the sonar-scan GitHub action. Declares the SonarCloud project
# key and organisation, the per-language coverage report paths so unit and
# integration coverage are merged in the dashboard, and a list of generated
# directories that the analyser must skip to avoid noisy "duplications" or
# "complexity" findings on auto-generated code.
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_s3-orchestrator
sonar.organization=afreidah

# Coverage report generated by go test -coverprofile
sonar.go.coverage.reportPaths=coverage.out,integration-coverage.out

# Source directories
#
# deploy/** covers the Cloudflare edge proxy worker, the one TypeScript
# component in an otherwise Go project. Sonar stays Go-only: the worker is
# typechecked and tested by its own vitest suite in the CI worker job, which
# enforces its own coverage thresholds rather than reporting into this
# dashboard.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testutil/**,**/mock_*,loadtest/**,web/**,deploy/**,benchmarks/**,packaging/**,**/*.sql,internal/store/postgres/sqlc/**,internal/store/storetest/**,internal/ops/opstest/**

# This is a Go-only project. The .sql files under internal/store/postgres/sqlc/queries are
# PostgreSQL DDL/DML for sqlc code-gen, not Oracle PL/SQL. Pin the PL/SQL analyzer
# to no file suffixes so it does not try to scan our schema and warn that the
# Oracle Data Dictionary is missing (rules S3641 / S3921 / S3618 / S3651).
sonar.plsql.file.suffixes=

# Coverage exclusions (not counted toward coverage metrics).
# The dashboard's static JS (tree.js, logs.js) is browser glue that
# requires a real DOM and fetch implementation to test meaningfully.
# Adding a JS toolchain (Vitest/jsdom/lcov) for ~600 lines of vanilla
# browser code is disproportionate to the value, so static assets are
# excluded from the coverage metric.
sonar.coverage.exclusions=cmd/**,internal/testutil/**,internal/store/postgres/sqlc/**,internal/backend/backendtest/**,internal/store/storetest/**,internal/ops/opstest/**,internal/encryption/vault.go,**/static/*.js,**/templates/*.html

# Test directories
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Encoding
sonar.sourceEncoding=UTF-8

# Suppress S107 (max parameters) for the object-package helpers that
# would otherwise wrap their per-attempt arguments in single-use
# *Request DTOs. The wider parameter lists are deliberate; the
# alternative is structure that exists only to satisfy the linter.
sonar.issue.ignore.multicriteria=s107obj,s5332xmlns
sonar.issue.ignore.multicriteria.s107obj.ruleKey=go:S107
sonar.issue.ignore.multicriteria.s107obj.resourceKey=internal/proxy/object/*.go

# Suppress S5332 (insecure HTTP) for the S3 XML namespace in helpers.go. AWS
# defines that namespace as http://s3.amazonaws.com/doc/2006-03-01/ and SDK
# clients match it literally to deserialize responses; it is an identifier this
# server echoes, never a URL it dereferences, so it cannot become https.
sonar.issue.ignore.multicriteria.s5332xmlns.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.s5332xmlns.resourceKey=internal/transport/s3api/helpers.go
