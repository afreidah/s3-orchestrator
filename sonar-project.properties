sonar.projectKey=afreidah_s3-orchestrator
sonar.organization=afreidah

# Coverage report generated by go test -coverprofile
sonar.go.coverage.reportPaths=coverage.out,integration-coverage.out

# Source directories
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testutil/**,**/mock_*,loadtest/**,web/**,deploy/**,benchmarks/**,packaging/**

# Coverage exclusions (not counted toward coverage metrics)
sonar.coverage.exclusions=cmd/**,internal/testutil/**,internal/store/sqlc/**,internal/backend/backendtest/**,internal/encryption/vault.go

# Test directories
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Encoding
sonar.sourceEncoding=UTF-8
