# -------------------------------------------------------------------------------
# CI Workflow - GitHub Actions
#
# Author: Alex Freidah
#
# Runs on push to main and pull requests. A path-detection job determines which
# file categories changed (Go, web/docs, packaging) and downstream jobs use
# those outputs to skip irrelevant work — e.g. a docs-only PR skips all Go
# testing. On push to main, Docker image builds run for the categories that
# changed.
# -------------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PATH DETECTION
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      packaging: ${{ steps.filter.outputs.packaging }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'sqlc.yaml'
              - 'internal/store/sqlc/queries/**'
              - 'Makefile'
              - '.golangci.yml'
            web:
              - 'web/**'
              - 'docs/**'
              - 'README.md'
            packaging:
              - 'nfpm.yaml'
              - 'packaging/**'
              - '.goreleaser.yaml'
            worker:
              - 'deploy/cloudflare-worker/**'

  # ---------------------------------------------------------------------------
  # GO CHECKS
  # ---------------------------------------------------------------------------
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check for Go/SQL changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '\.(go|sql)$|sqlc\.yaml$'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version bump
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:.version)
          PR_VERSION=$(cat .version)
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "::error::.version must be incremented when Go or SQL files change (current: $PR_VERSION)"
            exit 1
          fi
          echo "Version bumped: $BASE_VERSION → $PR_VERSION"

  # Catches go.mod drift between root and nested modules. The vendored
  # Hugo theme under web/themes/** is excluded - it is a third-party
  # project synced from upstream and pins its own minimum Go version.
  go-version-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Verify nested go.mod files match root
        run: |
          ROOT=$(awk '$1=="go"{print $2; exit}' go.mod)
          if [ -z "$ROOT" ]; then
            echo "::error::failed to parse go directive from root go.mod"
            exit 1
          fi
          echo "Root Go version: $ROOT"
          status=0
          while IFS= read -r mod; do
            ver=$(awk '$1=="go"{print $2; exit}' "$mod")
            if [ "$ver" != "$ROOT" ]; then
              echo "::error file=$mod::go directive $ver does not match root $ROOT"
              status=1
            else
              echo "ok: $mod -> $ver"
            fi
          done < <(find . -name go.mod -not -path './go.mod' -not -path './web/themes/*' -not -path './vendor/*')
          exit $status

  lint:
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Verify sqlc generated code
        run: go tool sqlc diff

      - name: Verify no doc-comment stubs
        run: make doc-stub-check

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0

      # loadtest is a separate Go module: the step above only covers the root
      # one, so without this it is never linted in CI either.
      - name: Lint loadtest module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0
          working-directory: loadtest

      # The Terraform provider is a separate Go module for the same reason, and
      # is reached by neither of the steps above.
      - name: Lint Terraform provider module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0
          working-directory: terraform/terraform-provider-s3-orchestrator

  test:
    needs: [changes]
    # Run on Go-touching PRs and on every push to main: a main push always
    # needs fresh coverage so the SonarQube scan can re-analyse main without
    # resetting stored coverage, even when only non-Go files changed.
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-coverage
          path: coverage.out

  govulncheck:
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go tool govulncheck ./...

      # The Terraform provider is a separate Go module with its own dependency
      # graph, which the root ./... above never reaches. Keep the version here
      # matching the golang.org/x/vuln the root module pins.
      - name: Run govulncheck on the Terraform provider module
        working-directory: terraform/terraform-provider-s3-orchestrator
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # Same as the unit test job: also run on every push to main so the
    # SonarQube scan has merged unit+integration coverage for main.
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -race -v -tags integration -count=1 -coverprofile=integration-coverage.out -covermode=atomic -coverpkg=./... ./internal/integration/ ./internal/store/postgres/

      - name: Upload integration coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-coverage
          path: integration-coverage.out

  # The provider's acceptance tests drive real terraform plan/apply/import
  # against an orchestrator in a container, so they need the image built first.
  # The image is built here rather than by the tests because the Dockerfile uses
  # BuildKit's platform arguments, which the Docker client library
  # testcontainers builds through does not provide.
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      # The registry reads the provider's documentation from the tagged commit,
      # so a schema change that does not regenerate it ships wrong docs.
      - name: Verify provider documentation is current
        run: make provider-docs && git diff --exit-code terraform/terraform-provider-s3-orchestrator/docs

      - name: Build orchestrator image
        run: docker build -t s3-orchestrator:acceptance .

      - name: Acceptance tests
        working-directory: terraform/terraform-provider-s3-orchestrator
        env:
          TF_ACC: "1"
          S3O_TEST_IMAGE: s3-orchestrator:acceptance
        run: go test -count=1 -timeout 20m -coverprofile=provider-coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload provider coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-coverage
          path: terraform/terraform-provider-s3-orchestrator/provider-coverage.out

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      # The module is tested against the provider built from this commit rather
      # than the released one, so a schema change and the module that consumes
      # it are checked together. dev_overrides means no init: terraform resolves
      # the provider from disk, and the tests mock it from there.
      - name: Module tests
        working-directory: terraform/modules/s3-orchestrator
        run: |
          set -euo pipefail

          bin="$RUNNER_TEMP/provider-bin"
          mkdir -p "$bin"
          (cd "$GITHUB_WORKSPACE/terraform/terraform-provider-s3-orchestrator" \
            && go build -o "$bin/terraform-provider-s3-orchestrator" .)

          cat > "$RUNNER_TEMP/dev.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "afreidah/s3-orchestrator" = "$bin"
            }
            direct {}
          }
          EOF

          TF_CLI_CONFIG_FILE="$RUNNER_TEMP/dev.tfrc" terraform test

  # ---------------------------------------------------------------------------
  # ADMIN API CONTRACT
  # ---------------------------------------------------------------------------
  # docs/openapi.yaml is generated from the admin route table, and the
  # generator's own test already fails when the committed copy is stale. What
  # that check cannot say is whether a change breaks callers: adding a field
  # and renaming one both just make the file different. oasdiff classifies the
  # two, and annotates the PR when a change would break an existing client.
  #
  # Annotations only, deliberately. Pre-1.0 the admin API is still allowed to
  # change shape; the point is that a breaking change is visible in review
  # rather than discovered by an operator. oasdiff exits 0 either way, so the
  # job stays green and the annotation carries the signal.
  openapi-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check whether the description changed
        id: changed
        run: |
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- docs/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::docs/openapi.yaml is unchanged; no contract comparison needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        if: steps.changed.outputs.changed == 'true'
        with:
          go-version-file: go.mod

      # Runs the same target a maintainer runs locally, so the oasdiff pin
      # lives in the Makefile alone. The base copy is read from the base
      # branch, so the comparison is against what it publishes today.
      - name: Compare the admin API contract against the base branch
        if: steps.changed.outputs.changed == 'true'
        run: |
          make openapi-breaking \
            OASDIFF_BASE=origin/${{ github.base_ref }} \
            OASDIFF_FORMAT=githubactions

  # ---------------------------------------------------------------------------
  # EDGE PROXY WORKER
  # ---------------------------------------------------------------------------
  worker:
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare-worker/package-lock.json

      # --ignore-scripts keeps a dependency's install hooks from executing on a
      # runner that holds repository credentials. None of the worker's dev
      # dependencies need one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run coverage

  # ---------------------------------------------------------------------------
  # SONARQUBE ANALYSIS
  # ---------------------------------------------------------------------------
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test, integration, provider]
    # Run on every push to main and on every PR. The test, integration and
    # provider jobs also run on main pushes, so coverage artifacts always exist
    # here and the scan re-analyses main (clearing fixed issues) without zeroing
    # coverage. A job that failed uploaded no coverage, and scanning without it
    # reports a drop that is really a missing file. A skipped job is fine: a PR
    # with no Go change has no coverage to lose.
    if: >-
      always()
      && github.actor != 'dependabot[bot]'
      && (github.event_name == 'pull_request' || github.event_name == 'push')
      && !contains(fromJSON('["failure", "cancelled"]'), needs.test.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.integration.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.provider.result)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unit-coverage
        continue-on-error: true

      - name: Download integration coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-coverage
        continue-on-error: true

      - name: Download provider coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: provider-coverage
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.packaging == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Install lintian
        run: sudo apt-get update && sudo apt-get install -y lintian

      - name: Prep changelog
        run: make prep-changelog

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          install-only: true

      # Through the target rather than calling goreleaser directly, so this job
      # and the Forgejo one that publishes to apt build the package the same
      # way. Invoking it here separately is what let the two drift apart.
      - name: Build and lint debs
        run: make deb-lint

  # ---------------------------------------------------------------------------
  # DOCKER IMAGES (push to main only)
  # ---------------------------------------------------------------------------
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint, test, integration]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Read version
        id: version
        run: echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/afreidah/s3-orchestrator:${{ steps.version.outputs.version }}
            ghcr.io/afreidah/s3-orchestrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # A Rekor 409 means the signature is already in the transparency log
        # (slow public instance + client retry), so treat that one case as success.
        run: |
          set +e
          out=$(cosign sign --yes ghcr.io/afreidah/s3-orchestrator@${DIGEST} 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists in the transparency log"; then
            echo "::warning::Rekor entry already present; treating as signed."
            exit 0
          fi
          exit $rc

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/afreidah/s3-orchestrator:${{ steps.version.outputs.version }}
          exit-code: 1
          severity: CRITICAL,HIGH

  docker-webpage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Read version
        id: version
        run: echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            APK_CACHEBUST=${{ github.sha }}
          tags: |
            ghcr.io/afreidah/s3-orchestrator-webpage:${{ steps.version.outputs.version }}
            ghcr.io/afreidah/s3-orchestrator-webpage:latest
          cache-from: type=gha,scope=webpage-v3
          cache-to: type=gha,mode=max,scope=webpage-v3

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # A Rekor 409 means the signature is already in the transparency log
        # (slow public instance + client retry), so treat that one case as success.
        run: |
          set +e
          out=$(cosign sign --yes ghcr.io/afreidah/s3-orchestrator-webpage@${DIGEST} 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists in the transparency log"; then
            echo "::warning::Rekor entry already present; treating as signed."
            exit 0
          fi
          exit $rc

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/afreidah/s3-orchestrator-webpage:${{ steps.version.outputs.version }}
          exit-code: 1
          severity: CRITICAL,HIGH
