# -------------------------------------------------------------------------------
# CI Workflow - GitHub Actions
#
# Author: Alex Freidah
#
# Runs on push to main and pull requests. A path-detection job determines which
# file categories changed (Go, web/docs, packaging) and downstream jobs use
# those outputs to skip irrelevant work — e.g. a docs-only PR skips all Go
# testing. On push to main, Docker image builds run for the categories that
# changed.
# -------------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PATH DETECTION
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'sqlc.yaml'
              - 'internal/store/sqlc/queries/**'
              - 'Makefile'
              - '.golangci.yml'
            web:
              - 'web/**'
              - 'docs/**'
              - 'README.md'
            packaging:
              - 'nfpm.yaml'
              - 'packaging/**'
              - '.goreleaser.yaml'

  # ---------------------------------------------------------------------------
  # GO CHECKS
  # ---------------------------------------------------------------------------
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check for Go/SQL changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '\.(go|sql)$|sqlc\.yaml$'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version bump
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:.version)
          PR_VERSION=$(cat .version)
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "::error::.version must be incremented when Go or SQL files change (current: $PR_VERSION)"
            exit 1
          fi
          echo "Version bumped: $BASE_VERSION → $PR_VERSION"

  # Catches go.mod drift between root and nested modules. The vendored
  # Hugo theme under web/themes/** is excluded - it is a third-party
  # project synced from upstream and pins its own minimum Go version.
  go-version-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Verify nested go.mod files match root
        run: |
          ROOT=$(awk '$1=="go"{print $2; exit}' go.mod)
          if [ -z "$ROOT" ]; then
            echo "::error::failed to parse go directive from root go.mod"
            exit 1
          fi
          echo "Root Go version: $ROOT"
          status=0
          while IFS= read -r mod; do
            ver=$(awk '$1=="go"{print $2; exit}' "$mod")
            if [ "$ver" != "$ROOT" ]; then
              echo "::error file=$mod::go directive $ver does not match root $ROOT"
              status=1
            else
              echo "ok: $mod -> $ver"
            fi
          done < <(find . -name go.mod -not -path './go.mod' -not -path './web/themes/*' -not -path './vendor/*')
          exit $status

  lint:
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Verify sqlc generated code
        run: go tool sqlc diff

      - name: Verify no doc-comment stubs
        run: make doc-stub-check

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0

      # loadtest is a separate Go module: the step above only covers the root
      # one, so without this it is never linted in CI either.
      - name: Lint loadtest module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0
          working-directory: loadtest

  test:
    needs: [changes]
    # Run on Go-touching PRs and on every push to main: a main push always
    # needs fresh coverage so the SonarQube scan can re-analyse main without
    # resetting stored coverage, even when only non-Go files changed.
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-coverage
          path: coverage.out

  govulncheck:
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go tool govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # Same as the unit test job: also run on every push to main so the
    # SonarQube scan has merged unit+integration coverage for main.
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -race -v -tags integration -count=1 -coverprofile=integration-coverage.out -covermode=atomic -coverpkg=./... ./internal/integration/ ./internal/store/postgres/

      - name: Upload integration coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-coverage
          path: integration-coverage.out

  # ---------------------------------------------------------------------------
  # ADMIN API CONTRACT
  # ---------------------------------------------------------------------------
  # docs/openapi.yaml is generated from the admin route table, and the
  # generator's own test already fails when the committed copy is stale. What
  # that check cannot say is whether a change breaks callers: adding a field
  # and renaming one both just make the file different. oasdiff classifies the
  # two, and annotates the PR when a change would break an existing client.
  #
  # Annotations only, deliberately. Pre-1.0 the admin API is still allowed to
  # change shape; the point is that a breaking change is visible in review
  # rather than discovered by an operator. oasdiff exits 0 either way, so the
  # job stays green and the annotation carries the signal.
  openapi-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check whether the description changed
        id: changed
        run: |
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- docs/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::docs/openapi.yaml is unchanged; no contract comparison needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        if: steps.changed.outputs.changed == 'true'
        with:
          go-version-file: go.mod

      # Runs the same target a maintainer runs locally, so the oasdiff pin
      # lives in the Makefile alone. The base copy is read from the base
      # branch, so the comparison is against what it publishes today.
      - name: Compare the admin API contract against the base branch
        if: steps.changed.outputs.changed == 'true'
        run: |
          make openapi-breaking \
            OASDIFF_BASE=origin/${{ github.base_ref }} \
            OASDIFF_FORMAT=githubactions

  # ---------------------------------------------------------------------------
  # SONARQUBE ANALYSIS
  # ---------------------------------------------------------------------------
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test, integration]
    # Run on every push to main and on every PR. The test/integration jobs
    # also run on main pushes, so coverage artifacts always exist here and the
    # scan re-analyses main (clearing fixed issues) without zeroing coverage.
    # PRs with no Go change still run (their gate has no coverage condition).
    if: always() && github.actor != 'dependabot[bot]' && needs.test.result != 'failure' && needs.test.result != 'cancelled' && (github.event_name == 'pull_request' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unit-coverage
        continue-on-error: true

      - name: Download integration coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-coverage
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.packaging == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Install lintian
        run: sudo apt-get update && sudo apt-get install -y lintian

      - name: Prep changelog
        run: make prep-changelog

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Build debs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign

      - name: Lint debs
        run: |
          for f in dist/*.deb; do echo "--- $f ---"; lintian --tag-display-limit 0 "$f"; done

  # ---------------------------------------------------------------------------
  # DOCKER IMAGES (push to main only)
  # ---------------------------------------------------------------------------
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint, test, integration]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Read version
        id: version
        run: echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/afreidah/s3-orchestrator:${{ steps.version.outputs.version }}
            ghcr.io/afreidah/s3-orchestrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # A Rekor 409 means the signature is already in the transparency log
        # (slow public instance + client retry), so treat that one case as success.
        run: |
          set +e
          out=$(cosign sign --yes ghcr.io/afreidah/s3-orchestrator@${DIGEST} 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists in the transparency log"; then
            echo "::warning::Rekor entry already present; treating as signed."
            exit 0
          fi
          exit $rc

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/afreidah/s3-orchestrator:${{ steps.version.outputs.version }}
          exit-code: 1
          severity: CRITICAL,HIGH

  docker-webpage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Read version
        id: version
        run: echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            APK_CACHEBUST=${{ github.sha }}
          tags: |
            ghcr.io/afreidah/s3-orchestrator-webpage:${{ steps.version.outputs.version }}
            ghcr.io/afreidah/s3-orchestrator-webpage:latest
          cache-from: type=gha,scope=webpage-v3
          cache-to: type=gha,mode=max,scope=webpage-v3

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # A Rekor 409 means the signature is already in the transparency log
        # (slow public instance + client retry), so treat that one case as success.
        run: |
          set +e
          out=$(cosign sign --yes ghcr.io/afreidah/s3-orchestrator-webpage@${DIGEST} 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists in the transparency log"; then
            echo "::warning::Rekor entry already present; treating as signed."
            exit 0
          fi
          exit $rc

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/afreidah/s3-orchestrator-webpage:${{ steps.version.outputs.version }}
          exit-code: 1
          severity: CRITICAL,HIGH
