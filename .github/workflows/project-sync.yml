# -------------------------------------------------------------------------------
# s3-orchestrator - Project Board Sync
#
# Automatically adds new and reopened issues to the kanban board so they
# don't have to be added manually.
# -------------------------------------------------------------------------------

name: Project Sync

on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    name: Add to project board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/afreidah/projects/3
          github-token: ${{ secrets.PROJECT_TOKEN }}
