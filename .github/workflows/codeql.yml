# -------------------------------------------------------------------------------
# CodeQL Workflow - GitHub Actions
#
# Author: Alex Freidah
#
# Replaces CodeQL default setup, which cannot analyse this repository's Go code:
# the runner image ships an older Go than go.mod requires and autobuild sets
# GOTOOLCHAIN=local, so the extractor's `go list` refuses to run and extraction
# fails before any query executes. Installing the version go.mod names is the
# fix, and default setup has nowhere to put that step.
#
# All three languages live here because a language cannot span both setups -
# GitHub rejects an advanced configuration's results while default setup is
# enabled, whatever languages each one names.
#
# Only Go needs a build. The other two are analysed from source.
# -------------------------------------------------------------------------------

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, the cadence default setup ran at.
    - cron: '24 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Ahead of init: autobuild inherits whatever go is on PATH, and the
      # extractor resolves packages with it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
