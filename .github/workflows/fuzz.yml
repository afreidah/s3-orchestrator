# -------------------------------------------------------------------------------
# Nightly Fuzz Testing - GitHub Actions
#
# Author: Alex Freidah
#
# Runs all fuzz targets nightly with meaningful run times (2 minutes each).
# On failure, uploads the crashing input as an artifact and opens a GitHub
# issue so the finding is tracked. Crashing inputs should be committed to
# testdata/fuzz/ to become permanent regression tests.
# -------------------------------------------------------------------------------

name: Fuzz

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC daily
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParseSigV4Fields
            package: ./internal/transport/auth/
          - target: FuzzBuildCanonicalRequest
            package: ./internal/transport/auth/
          - target: FuzzBuildPresignedCanonicalRequest
            package: ./internal/transport/auth/
          - target: FuzzChunkReader
            package: ./internal/transport/auth/
          - target: FuzzPatternMatches
            package: ./internal/transport/cors/
          - target: FuzzParseHeaderList
            package: ./internal/transport/cors/
          - target: FuzzParsePath
            package: ./internal/transport/s3api/
          - target: FuzzDeleteObjectsXML
            package: ./internal/transport/s3api/
          - target: FuzzCompleteMultipartXML
            package: ./internal/transport/s3api/
          - target: FuzzIsValidRequestID
            package: ./internal/transport/s3api/
          - target: FuzzLoginThrottle_RemoteAddr
            package: ./internal/transport/httputil/
          - target: FuzzExtractClientIP
            package: ./internal/transport/s3api/
          - target: FuzzValidMetadataToken
            package: ./internal/transport/s3api/
          - target: FuzzParsePlaintextRange
            package: ./internal/proxy/object/
          - target: FuzzParseQueryInt
            package: ./internal/transport/s3api/
          - target: FuzzParseHeader
            package: ./internal/encryption/
          - target: FuzzCiphertextRange
            package: ./internal/encryption/
          - target: FuzzUnpackKeyData
            package: ./internal/encryption/
          - target: FuzzDecompress
            package: ./internal/compression/
          - target: FuzzDecompressRanged
            package: ./internal/compression/
          - target: FuzzRangedSeekRead
            package: ./internal/compression/
          - target: FuzzRangedFetcherMisbehaves
            package: ./internal/compression/

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -fuzz is a regular expression, so the name is anchored: an unanchored
      # FuzzDecompress also matches FuzzDecompressRanged and go test refuses to
      # fuzz either.
      - name: Run fuzz target
        id: fuzz
        run: |
          set -o pipefail
          go test -fuzz='^${{ matrix.target }}$' -fuzztime=2m -timeout=3m ${{ matrix.package }} 2>&1 | tee fuzz.log

      # A real crash writes a NEW input file under testdata/fuzz/<target>/.
      # Tracked files in that directory are previously-found regressions
      # checked in as permanent coverage, so they show up every run and must
      # not trigger an issue. Only untracked files indicate a fresh crash.
      # The fuzz coordinator can also exit non-zero with "context deadline
      # exceeded" when an in-flight worker has not returned by the time
      # -fuzztime expires; that is a shutdown race, not a bug. Any other
      # failure with no crash file is reported as an error, since it means the
      # target never fuzzed.
      - name: Check for crashing input
        if: failure()
        id: corpus
        run: |
          files=$(git ls-files --others --exclude-standard -- "*/testdata/fuzz/${{ matrix.target }}/*")
          if [ -n "$files" ]; then
            {
              echo "has_crash=true"
              echo "corpus<<CORPUS_EOF"
              printf '%s\n' "$files" | head -5
              echo "CORPUS_EOF"
            } >> "$GITHUB_OUTPUT"
          elif grep -q "context deadline exceeded" fuzz.log; then
            echo "has_crash=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fuzz coordinator hit its deadline on shutdown with no new crashing input; not a bug."
          else
            echo "has_crash=false" >> "$GITHUB_OUTPUT"
            echo "::error::Fuzz target failed without a crashing input, so it did not fuzz. See the go test output above."
          fi

      - name: Upload crashing inputs
        if: failure() && steps.corpus.outputs.has_crash == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
          retention-days: 90

      - name: Open issue on failure
        if: failure() && steps.corpus.outputs.has_crash == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## Fuzz failure: \`${{ matrix.target }}\`

          **Package:** \`${{ matrix.package }}\`
          **Run:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Crashing inputs
          ${{ steps.corpus.outputs.corpus }}

          ### Next steps
          1. Download the \`fuzz-corpus-${{ matrix.target }}\` artifact from the run
          2. Copy the crashing input to \`testdata/fuzz/${{ matrix.target }}/\` in the package
          3. Run \`go test ${{ matrix.package }}\` to reproduce and fix"

          gh issue create \
            --title "fuzz: ${{ matrix.target }} crash found" \
            --label "bug" \
            --body "$BODY"
